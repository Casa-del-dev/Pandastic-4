# Browser phone pair: http://localhost:5173 (Basic) and http://localhost:5174 (Capable).
# Keep host port = container port: each phone's number is its port.
services:
  phones:
    build: { context: ., target: web }
    image: pandastic-phones
    ports: ["5173:5173", "5174:5174"]
    volumes: [phone-state:/state]
volumes:
  phone-state:
